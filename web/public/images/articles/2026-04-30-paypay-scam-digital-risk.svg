<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc"><title id="title">不審な請求・返金連絡への対応</title><desc id="desc">操作を止め、公式アプリで確認し、被害があれば記録を残して相談します。</desc><rect width="100%" height="100%" fill="#f1f6f7"/><g font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif"><text x="60" y="78" font-size="38" font-weight="700" fill="#163944">「請求」「返金」の連絡が来たら</text><text x="60" y="126" font-size="24" fill="#415c63">本物のアプリでも、送金する理由と相手を確認する</text><rect x="60" y="175" width="330" height="268" rx="16" fill="white" stroke="#cad9dd"/><text x="86" y="226" font-size="26" fill="#28747e" font-weight="700">01</text><text x="86" y="279" font-size="28" font-weight="700" fill="#163944">まず操作を止める</text><text x="86" y="330" font-size="22" fill="#415c63">送金・画面共有は止める</text><text x="86" y="372" font-size="22" fill="#415c63">相手の指示をいったん離れる</text><path d="M403 293h21l-8-8m8 8-8 8" stroke="#28747e" stroke-width="3" fill="none"/><rect x="435" y="175" width="330" height="268" rx="16" fill="white" stroke="#cad9dd"/><text x="461" y="226" font-size="26" fill="#28747e" font-weight="700">02</text><text x="461" y="279" font-size="28" font-weight="700" fill="#163944">公式で確認する</text><text x="461" y="330" font-size="22" fill="#415c63">自分で公式アプリを開く</text><text x="461" y="372" font-size="22" fill="#415c63">元の取引と返金状況を見る</text><path d="M778 293h21l-8-8m8 8-8 8" stroke="#28747e" stroke-width="3" fill="none"/><rect x="810" y="175" width="330" height="268" rx="16" fill="white" stroke="#cad9dd"/><text x="836" y="226" font-size="26" fill="#28747e" font-weight="700">03</text><text x="836" y="279" font-size="28" font-weight="700" fill="#163944">記録して相談する</text><text x="836" y="330" font-size="22" fill="#415c63">取引・やり取りを保存する</text><text x="836" y="372" font-size="22" fill="#415c63">公式窓口・公的窓口へ相談</text><text x="60" y="502" font-size="23" fill="#415c63">送金後のキャンセル・補償には条件があります。本文の公式案内を確認してください。</text></g></svg>