name: Fetch news + market data

on:
  schedule:
    - cron: '0 22 * * *'   # 毎日 UTC 22:00 = JST 07:00
  workflow_dispatch:
    inputs:
      ref:
        description: "実行するブランチ名"
        required: false
        default: "main"

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}
          token: ${{ secrets.PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute date
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Collect sources independently
        id: collect
        continue-on-error: true
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_QUERY_ID: ${{ secrets.DUNE_QUERY_ID }}
          METACULUS_API_KEY: ${{ secrets.METACULUS_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
        run: |
          python src/collect_data.py collect --date "${{ steps.date.outputs.today }}" --manifest "$RUNNER_TEMP/collection-status.json"

      - name: Commit data
        if: ${{ !cancelled() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        run: |
          python src/collect_data.py stage --manifest "$RUNNER_TEMP/collection-status.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "data: fetch ${{ steps.date.outputs.today }}"
          git push

      # A degraded fetch remains red, but only after valid data can be saved.
      - name: Report collection status
        if: ${{ always() && !cancelled() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        run: python src/collect_data.py report --manifest "$RUNNER_TEMP/collection-status.json"
